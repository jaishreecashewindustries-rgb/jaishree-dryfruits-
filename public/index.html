<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3E2723" />
    <meta name="description" content="Jai Shree Dryfruits - Premium Quality Dry Fruits & Nuts. Shop the finest almonds, cashews, pistachios, and more. Fresh, authentic, and delivered to your door." />
    <meta name="keywords" content="dry fruits, nuts, almonds, cashews, pistachios, walnuts, premium dry fruits, jai shree dryfruits" />
    <meta property="og:title" content="Jai Shree Dryfruits - Premium Dry Fruits & Nuts" />
    <meta property="og:description" content="Shop premium quality dry fruits and nuts. Fresh, authentic, and delivered to your door." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <title>Jai Shree Dryfruits - Premium Dry Fruits & Nuts</title>
    <!-- Razorpay Checkout SDK — loaded async, used only at checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <!-- Google Translate — full-site auto-translation -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,mr,gu,pa,bn,ta,te,kn,ml,ur',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

    <style>
      /* Hide Google's default banner/toolbar — we use our own UI */
      .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      body { top: 0 !important; }
      .goog-te-gadget { font-size: 0 !important; }
      .goog-te-gadget .goog-te-combo { font-size: 13px !important; }
      #google_translate_element { display: none; }
      /* Prevent translation of logo/brand name */
      .notranslate { translate: no; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Hidden Google Translate widget — controlled programmatically -->
    <div id="google_translate_element"></div>
  </body>
</html>
